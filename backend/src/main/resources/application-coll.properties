spring.application.name=dentalcare-api

# ═══════════════════════════════════════════════════════════════════════════════
# Profilo COLLAUDO (#41). Ricalcato su application-prod.properties, con:
#  - DB dentalcare_coll
#  - radice bucket MinIO dc-coll- (#40) → documenti isolati da dev e prod
#  - demo OFF (come prod: Coll non espone credenziali demo sulla rete .72)
#  - log/errori stile dev (diagnosi rapida durante il collaudo)
# Le credenziali reali (DB, JWT, master-key) stanno nella config montata gitignored
# config/application-coll.properties, MAI in git, e DIVERSE da quelle di prod.
# ═══════════════════════════════════════════════════════════════════════════════

# PostgreSQL - dentalcare_coll su 192.168.0.173
spring.datasource.url=jdbc:postgresql://192.168.0.173:5432/dentalcare_coll
spring.datasource.username=postgres
# spring.datasource.password -> config/application-coll.properties
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA - no DDL, no schema validation
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway: gestito da FlywayConfig custom
spring.flyway.enabled=false
app.flyway.schemas=dentalcare
app.flyway.baseline-version=4
app.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# JWT -> config/application-coll.properties
app.jwt.expiration-ms=86400000

# AI inference service (raggiunto per nome-servizio nella rete interna del progetto Coll)
app.ai.base-url=http://dentalcare-ai-service:8000
app.ai.hmac-secret=CHANGE_ME_HMAC_SECRET_PLACEHOLDER

# MinIO object storage — endpoint/credenziali reali nella config montata (gitignored).
# #40 — radice bucket per ambiente: Coll usa lo stesso MinIO fisico di prod, isolato
# via prefisso dc-coll-. Coll non ha dati reali da migrare: adotta il prefisso direttamente.
app.minio.endpoint=http://host.docker.internal:9000
app.minio.access-key=CHANGE_ME_MINIO_USER
app.minio.secret-key=CHANGE_ME_MINIO_PASSWORD
app.minio.bucket-prefix=dc-coll-

# GDPR field encryption (#7) — master key REALE nella config montata, DIVERSA da prod.
# Placeholder non-hex di proposito: senza chiave valida il backend non parte (fail-fast).
app.encryption.key-source=config
app.encryption.master-key=CHANGE_ME_ENCRYPTION_MASTER_KEY_64_HEX

# Tenant provisioning
tenant.tablespace.base-path=

# Demo mode: OFF (confermato 23/07/2026)
app.demo.enabled=false

# Mail (SMTP)
spring.mail.host=192.168.0.68
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false
app.mail.from=noreply@dentalcare.it
app.mail.send-real-emails=false

# Server
server.port=8080

# Logging: stile dev per il collaudo
logging.level.root=INFO
logging.level.com.dentalcare=DEBUG
logging.level.org.springframework.jdbc.core=WARN

# Errori: esposti (diagnosi rapida durante il collaudo)
server.error.include-message=always
server.error.include-binding-errors=always
